<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211836"><title>月兔派对</title><link rel="stylesheet" href="style.css?v=results6">
</head>
<body>
<main class="game-frame" aria-label="月兔派对">
<header class="topbar">
<span class="moon" aria-hidden="true">🌕</span>
<div class="score" aria-label="月饼积分">🥮 <strong id="scoreLabel">0</strong></div>
<div class="clock" aria-label="剩余时间">⏳ <strong id="timeLabel">60</strong></div>
<div class="top-actions">
<button id="musicNext" aria-label="换一首歌">⏭</button>
<button id="soundBtn" aria-label="关闭声音">🔊</button>
<button id="pauseBtn" aria-label="暂停" disabled>⏸</button>
</div>
</header>
<section class="arena-wrap" aria-label="游戏场地">
<canvas id="arena" width="960" height="600" aria-label="点月饼或拖动手指，让玉兔去收集月饼"></canvas>
<button id="touchDash" class="touch-dash" aria-label="加速" disabled>⚡</button>
<div id="toast" class="toast" role="status"></div>
<div id="eventBanner" class="event-banner"></div>
<div id="overlay" class="overlay">
<div class="overlay-card">
<div id="introFriends" class="friends" aria-hidden="true"><img src="assets/guests/critter_05_dogday.webp" alt=""><span id="overlayArt">🐰</span><img src="assets/guests/mikey.webp" alt=""></div>
<div id="results" class="results" role="group" aria-label="本局成绩" hidden></div>
<div id="winStars" class="win-stars" hidden>⭐ ⭐ ⭐</div>
<button id="startBtn" class="play-button" aria-label="开始游戏">▶</button>
<div id="gestureDemo" class="gesture-demo" aria-hidden="true"><span>👆</span><span>🥮</span><span>✨</span></div>
</div>
</div>
</section>
<audio id="musicPlayer" preload="none" playsinline></audio>
<div hidden aria-hidden="true"><span id="overlayKicker"></span><span id="overlayTitle"></span><span id="overlayBody"></span><span id="overlayHint"></span><div id="modePicker"></div><span id="rankLabel"></span><span id="comboLabel"></span><div id="leaderboard"></div><button id="dashBtn"></button><span id="dashStatus"></span><span id="missionLabel"></span><span id="bestParty"></span><span id="bestDuo"></span><span id="bestRush"></span></div>
</main>
<script src="game.js?v=results6"></script>
</body></html>
